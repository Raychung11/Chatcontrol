# Evolution API server for the AiServe Shared WhatsApp Inbox.
#
# Runs Evolution v2 (Baileys) plus Postgres + Redis for state.
# Drop on any Linux host with Docker, then point your portal Settings at it.
#
# Usage:
#   1. cp .env.evolution.example .env
#      and edit AUTHENTICATION_API_KEY + (optional) AUTHENTICATION_API_KEY_LIST
#   2. docker compose -f docker-compose.evolution.yml --env-file .env up -d
#   3. Visit http://YOUR_HOST:8080  (put behind a TLS proxy in production)
#   4. In the AiServe portal -> Admin -> Settings:
#        Provider = Evolution
#        Base URL = https://evo.YOUR_HOST.com
#        API key   = (the AUTHENTICATION_API_KEY value)
#        Instance  = whatever name you want (e.g. aiserve-prod)
#   5. Admin -> Pair WhatsApp -> Start pairing -> scan QR.

services:
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: aiserve-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://localhost:8080}

      # Persistence
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: aiserve
      DATABASE_SAVE_DATA_INSTANCE:    "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE:   "true"
      DATABASE_SAVE_DATA_CONTACTS:    "true"
      DATABASE_SAVE_DATA_CHATS:       "true"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: aiserve

      # Auth - rotate this key and put it in your portal Settings.
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:-please-change-me}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # CORS - restrict to your portal domain in production.
      CORS_ORIGIN: "*"
      CORS_METHODS: "POST,GET,PUT,DELETE"

      # Webhook defaults (the portal also sets these per-instance via API)
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: AiServe
      CONFIG_SESSION_PHONE_NAME: Chrome

      LOG_LEVEL: ERROR,WARN,INFO
      LOG_COLOR: "true"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: aiserve-evolution-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aiserve-evolution-redis
    restart: unless-stopped
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_store:
  evolution_pg:
  evolution_redis:
